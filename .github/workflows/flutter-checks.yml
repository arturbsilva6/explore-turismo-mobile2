name: Flutter - análise e testes

on:
  pull_request:
    branches: [main, feat/entrega-final-mobile2]
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolver dependências
        run: flutter pub get
      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos
      - name: Executar testes
        run: flutter test
      - name: Configurar SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Compilar APK Android debug
        run: flutter build apk --debug --dart-define=FIREBASE_ENABLED=true
